[build-system]
requires = ["scikit-build-core>=1.1", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "piqtree"
dependencies = [
    "citeable>=2026.3.11b0",
    "cogent3>=2026.4.20a0",
    "pyyaml",
    "requests"
]
requires-python = ">=3.12"

authors = [
    { name = "Gavin Huttley" },
    { name = "Robert McArthur" },
    { name = "Bui Quang Minh " },
    { name = "Richard Morris" },
    { name = "Thomas Wong" }
]
description = "Python bindings for IQTree"
readme = "README.md"
dynamic = ["version"]

license = "GPL-2.0-only"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 4 - Beta",

    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",

    "Natural Language :: English",

    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",

    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Typing :: Typed"
]

[project.urls]
Repository = "https://github.com/cogent3/piqtree"
Documentation = "https://piqtree.readthedocs.io"


[project.optional-dependencies]
extra = ["cogent3[extra]"]

[dependency-groups]
dev = [
    "cibuildwheel==4.3.1",
    "delvewheel==1.13.1",
    "scriv",
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typing" }
]
test = ["pytest", "pytest-cov", "pytest-markdown-docs", "pytest-mock", "nox>=2025.2.9"]
lint = ["ruff==0.17.0"]
typing = ["mypy==2.4.0", "nanobind==3.1.0", { include-group = "stubs" }, { include-group = "test" }]
stubs = ["types-PyYAML", "types-requests"]
doc = [
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    "pymdown-extensions",
    "jupytext",
    "cogent3[extra]",
    "diverse-seq>=2025.7.10",
    "jupyter",
    "ipywidgets",
    { include-group = "test" }
]

[project.entry-points."cogent3.app"]
piq_build_tree = "piqtree._app:piq_build_tree"
piq_fit_tree = "piqtree._app:piq_fit_tree"
piq_random_tree = "piqtree._app:piq_random_tree"
piq_jc_distances = "piqtree._app:piq_jc_distances"
piq_nj_tree = "piqtree._app:piq_nj_tree"
piq_model_finder = "piqtree._app:piq_model_finder"
piq_consensus_tree = "piqtree._app:piq_consensus_tree"
piq_simulate_alignment = "piqtree._app:piq_simulate_alignment"

[project.entry-points."cogent3.hook"]
quick_tree = "piqtree._app:piq_nj_tree"

[tool.scikit-build]
minimum-version = "build-system.requires"
# Keep the CMake build between builds so rebuilds are incremental.
build-dir = "build/{wheel_tag}"
# Build abi3 wheels, which support all CPython versions from 3.12 onwards.
wheel.py-api = "cp312"
wheel.exclude = [
    "piqtree/_libiqtree/README.txt",
    "piqtree/_libiqtree/*.cpp",
    "piqtree/_libiqtree/*.h",
    "piqtree/_libiqtree/*.a",
    "piqtree/_libiqtree/*.lib"
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "src/piqtree/__init__.py"

[tool.cibuildwheel]
# Free-threaded Python can't use abi3 wheels.
skip = "cp3??t-*"
# The abi3 wheel built for the oldest Python is reused for (and tested on) the
# newer versions.
test-groups = ["test"]
test-command = "pytest {package}/tests"

[tool.cibuildwheel.linux]
before-all = "./build_tools/before_all_linux.sh"

[tool.cibuildwheel.macos]
before-all = "./build_tools/before_all_mac.sh"
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }

[tool.cibuildwheel.windows]
before-all = "bash ./build_tools/before_all_windows.sh"
# delvewheel vendors IQ-TREE's DLLs, so don't also install them via CMake.
config-settings = { "cmake.define.PIQTREE_BUNDLE_DLLS" = "OFF" }
repair-wheel-command = "delvewheel repair --add-path src/piqtree/_libiqtree -w {dest_dir} {wheel}"

[tool.uv]
# The C++ extension is compiled at install time, so rebuild piqtree whenever
# the extension source, the IQ-TREE library or the version changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "src/piqtree/__init__.py" },
    { file = "src/piqtree/_libiqtree/_piqtree.cpp" },
    { file = "src/piqtree/_libiqtree/_piqtree.h" },
    { file = "src/piqtree/_libiqtree/libiqtree.a" },
    { file = "src/piqtree/_libiqtree/iqtree.lib" },
    { file = "src/piqtree/_libiqtree/iqtree.dll" }
]

[tool.ruff]
exclude = [
    "iqtree3",
    "src/piqtree/_piqtree.pyi", # generated by nanobind.stubgen
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv"
]

# Same as Black.
line-length = 88
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["ALL"]
ignore = [
    "EXE002", # don't require shebang
    "E501", # allow long lines where appropriate
    "PLC0415", # allow imports inside functions
    "PLR0913", # allow many arguments
    "PLR2004", # allow magic value comparisons
    "D", # doc linting rules
    "CPY001", # don't require copyright notice in source files
    "PLR0917" # allow >5 positional arguments in function definitions
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # asserts allowed in tests...
    "INP001", # __init__.py files are not required...
    "N802", # allow non snake_case function names for fixtures
    "N803", # allow use of fixture constants
    "SLF001", # private member access is useful for testing
    "FBT001", # allow bool pos args for parameterisation
    "D" # don't require docstring linting
]
"docs/**/*.py" = ["B018", "E402", "ERA001", "INP001", "D"]
"src/piqtree/_app/__init__.py" = [
    "N801" # apps follow function naming convention
]
"src/piqtree/__init__.py" = [
    "E402", # handle DLLs before imports
    "PTH118", # os operations for DLL path
    "PTH120" # os operations for DLL path
]
"src/piqtree/model/_substitution_model.py" = [
    "N815" # use IQ-TREE naming scheme
]
"noxfile.py" = [
    "D" # Don't expect docstrings for noxfile
]
"rtd_get_docs.py" = [
    "D" # Don't expect docstrings for rtd file.
]


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.scriv]
format = "md"
categories = [
    "Contributors",
    "ENH",
    "BUG",
    "API",
    "DOC",
    "Deprecations",
    "Discontinued"
]
output_file = "changelog.md"
version = "literal: src/piqtree/__init__.py: __version__"
skip_fragments = "README.*"
new_fragment_template = "file: changelog.d/templates/new.md.j2"
entry_title_template = "file: changelog.d/templates/title.md.j2"

[[tool.mypy.overrides]]
module = ['cogent3.*']
ignore_missing_imports = true
