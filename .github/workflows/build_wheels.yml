name: Build Wheels

on: [workflow_dispatch, workflow_call]

permissions:
  contents: read

jobs:
  build:
    name: Build Wheels for ${{matrix.platform_id}} on ${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # manylinux x86_64
        - os: ubuntu-latest
          platform_id: manylinux_x86_64

        # manylinux aarch64
        - os: ubuntu-24.04-arm
          platform_id: manylinux_aarch64

        # MacOS arm64
        - os: macos-15
          platform_id: macosx_arm64

        # Windows x86_64
        - os: windows-latest
          platform_id: win_amd64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Boost
        if: runner.os == 'Windows'
        uses: MarkusJx/install-boost@v2.6.0
        id: install-boost
        with:
          boost_version: 1.84.0
          platform_version: 2022
          toolset: mingw

      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Wheels
        uses: pypa/cibuildwheel@v4.3.2
        env:
          CIBW_BUILD: "*${{matrix.platform_id}}"
          CIBW_ENVIRONMENT_WINDOWS: Boost_INCLUDE_DIR='${{ steps.install-boost.outputs.BOOST_ROOT }}/include' Boost_LIBRARY_DIRS='${{ steps.install-boost.outputs.BOOST_ROOT }}/lib'

      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.platform_id }}
          path: ./wheelhouse/*.whl
