name: Release

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build Wheels
    uses: ./.github/workflows/build_wheels.yml

  build-iqtree:
    name: Fetch or Build IQ-TREE Static Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - id: build
        uses: ./.github/actions/build-iqtree
        with:
          os: ubuntu-latest
    
    outputs:
      iqtree-sha: ${{steps.build.outputs.iqtree-sha}}
        
  build-docs:
    runs-on: ubuntu-latest
    needs: build-iqtree
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/setup-piqtree
        with:
          python-version: "3.15"
          cache-key: libiqtree-ubuntu-latest-${{ needs.build-iqtree.outputs.iqtree-sha }}
      
      - name: Install Docs Dependencies
        run: |
          uv sync --locked --no-default-groups --no-editable --group doc

      - name: Build Documentation
        run: |
          uv run --no-sync mkdocs build
        working-directory: ${{ github.workspace }}

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v7
        with:
          name: piqtree-docs-html
          path: site

  release-test:
    name: Release to Test PyPI
    needs: [build-wheels, build-docs]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:      
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish Package Distributions to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
  
  release:
    name: Release to PyPI
    needs: release-test
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:      
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish Package Distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1